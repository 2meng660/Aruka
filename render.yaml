services:
  - type: web
    name: kh01-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 render:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STALE_SECONDS
        value: "120"
      - key: MQTT_HOST
        value: t569f61e.ala.asia-southeast1.emqxsl.com
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_TLS
        value: "1"
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
