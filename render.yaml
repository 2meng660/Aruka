services:
  - type: web
    name: kh01-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: STALE_SECONDS
        value: "120"
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
